name: Set maintenance mode

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - test
          - preproduction
          - production
      mode:
        required: true
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  set-maintenance-mode:
    name: Set maintenance mode
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable or disable maintenance mode
        uses: DFE-Digital/github-actions/maintenance@99407ff048382a3c5b65d9a5fc2699ae0732fc35 # master on 2026-11-04, the repo has no version tags
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.environment }}
          mode: ${{ inputs.mode }}
          docker-repository: ghcr.io/dfe-digital/check-childrens-barred-list-maintenance
          github-token: ${{ secrets.GITHUB_TOKEN }}
